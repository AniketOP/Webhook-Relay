spring.application.name=Webhook-Delivery-Platform-Backend

spring.datasource.url=jdbc:postgresql://localhost:5432/webhook_platform
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,metrics,prometheus

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=webhook-delivery-group
spring.kafka.consumer.auto-offset-reset=earliest


resilience4j.circuitbreaker.configs.default.sliding-window-size=5
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=1

logging.pattern.console=%d{HH:mm:ss} [%X{deliveryId}] %-5level %logger{36} - %msg%n

